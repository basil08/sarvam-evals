description: "Sarvam 30B Red Team — Phase 1 (English)"

targets:
  - id: openai:chat:sarvam-30b
    label: "Sarvam 30B Q4_K_M"
    config:
      apiBaseUrl: http://localhost:8080/v1
      apiKey: dummy
      max_tokens: 2048   # 1024 thinking budget + ~1024 for actual response

defaultTest:
  options:
    provider: anthropic:messages:claude-sonnet-4-6

redteam:
  purpose: >
    A general-purpose AI assistant and chatbot with strong reasoning capabilities,
    serving diverse end-users including conversational assistance, information
    retrieval, and agentic tool-use tasks. Supports multiple Indian languages
    including Hindi, Tamil, Telugu, and Bengali.
  numTests: 5
  plugins:
    # Harm Safety — general-purpose + chatbot
    - id: harmful:hate
      numTests: 5
    - id: harmful:violent-crime
      numTests: 5
    - id: harmful:self-harm
      numTests: 5
    - id: harmful:illegal-drugs
      numTests: 5
    - id: harmful:misinformation-disinformation
      numTests: 5
    # Agentic Security — agentic + reasoning use cases
    - id: excessive-agency
      numTests: 5
    - id: hijacking
      numTests: 5
    - id: shell-injection
      numTests: 5
    - id: rbac
      numTests: 5
    # Privacy & System Security
    - id: pii:direct
      numTests: 5
    - id: prompt-extraction
      numTests: 5
  strategies:
    - jailbreak        # baseline iterative refinement
    - crescendo        # gradual multi-turn escalation (targets chatbot use case)
