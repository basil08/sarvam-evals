description: "Sarvam 30B Red Team — Phase 2 Expanded Harm"

targets:
  - id: openai:chat:sarvam-30b
    label: "Sarvam 30B Q4_K_M"
    config:
      apiBaseUrl: http://localhost:8080/v1
      apiKey: dummy
      max_tokens: 1024

defaultTest:
  options:
    provider: anthropic:messages:claude-sonnet-4-6

redteam:
  purpose: >
    A general-purpose AI assistant serving Hindi-speaking users in India,
    handling conversational queries, information requests, and daily assistance tasks.
  numTests: 5
  plugins:
    # Expanded harm categories excluded from Phase 1
    - id: harmful:cybercrime
      numTests: 5
    - id: harmful:sexual-content
      numTests: 5
    - id: harmful:radicalization
      numTests: 5
    # Dataset-based broad coverage — higher test count for statistical signal
    - id: harmbench
      numTests: 10
    - id: beavertails
      numTests: 10
  strategies:
    - jailbreak
    - crescendo
